system_errors:
  file_path_required: "file_path is required."
  file_not_found: "File not found: {path}."
  config_file_json: "Config file must be a .json file: {path}."
  invalid_json: "Invalid JSON in config file {path}: {msg}."
  config_json_object: "Config JSON must contain an object at the root."
  config_json_key_object: "Config JSON must contain a '{req_key}' object."
  could_not_resolve_file_type: "Could not resolve file type. Provide --file-type or use a file path with an extension."
  invalid_shift_label: "Invalid shift label at row {row}, column {col}: {cell!r}."
  unsupported_file_type: "Unsupported file type: {file_type}."
