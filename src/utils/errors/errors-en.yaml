  row_col_ge_0: "row_count and col_count must be greater than or equal to 0."
  not_a_weekend_day: "Date {date} is not a weekend day in this month."
  worker_not_found: "No worker found for worker id {worker_id}."
  shift_date_out_of_range: "Shift date {date} is out of schedule range."
  config_section_object: "Config section '{section}' must contain an object."
  config_section_index: "Config section '{section}.index' must be an integer greater than or equal to 1."
  invalid_day_at_index: "Invalid day '{day}' at date index {idx} for {year:04d}-{month:02d}."
  import_key_object: "Config 'import' key must contain an object."
  import_year_int: "Import config 'year' must be an integer."
  import_month_int: "Import config 'month' must be an integer."
  import_day_int: "Import config 'day' must be an integer."
  import_month_range: "Import config 'month' must be between 1 and 12."
  import_day_range: "Invalid day '{day}' for {year:04d}-{month:02d}."
  import_shift_types_object: "Import config 'shift_types' must contain an object."
  config_data_mapping: "Config data must be a mapping."
  config_not_initialized: "Config singleton is not initialized. Call {method_ref}(...) during startup first."
