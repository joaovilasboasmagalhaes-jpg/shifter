  soft_constraint_return_tuple_required: "Soft constraint '{fn.__name__}' must return a tuple: (score, per_worker_score)."
  soft_constraint_score_number_required: "Soft constraint '{fn.__name__}' must return a numeric score as the first tuple value."
  soft_constraint_per_worker_score_dict_required: "Soft constraint '{fn.__name__}' must return a dict as the second tuple value (per_worker_score)."
  title_and_description_required: "Both title and description are required for a constraint."

constraints:
  hard:
    consecutive_shifts: "Worker {worker.name} has more than 5 consecutive shifts."

  soft:
    weekend_shift: "Worker {worker.name} has no full weekend off in {month_key[0]}-{month_key[1]:02d}."
    missing_weekend: "Missing weekend shift data for worker {worker.name} in {ww0} - {ww1}. Working weekend constraint not applied for this month for this worker."

errors:
  shift_type_no_hours: "ShiftType {name} does not have defined hours."
  unknown_shift_short_label: "Unknown shift short label: {short_label}."
